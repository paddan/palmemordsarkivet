services:
  neo4j:
    image: neo4j:5
    container_name: palme-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser-UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?sätt NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_max__size: "2G"
    volumes:
      - ./data:/data
