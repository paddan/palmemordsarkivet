[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palmemordsarkivet"
version = "0.1.0"
description = "Skript för att ladda ner, OCR-tolka och söka i palmemordsarkivet.se"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "requests>=2.28,<3",
    "gdown>=4.6,<7",
    "tenacity>=8.0,<10",
    "langdetect>=1.0.9,<2",
    "sentence-transformers>=2.2,<5",
    "lancedb>=0.4,<1",
    "pyarrow>=12.0,<25",
    "claude-agent-sdk>=0.1,<1",
    "pypdfium2>=4.28,<5",
]

[project.optional-dependencies]
surya = [
    "surya-ocr",
    "transformers<5",
    "pymupdf",
    "pypdfium2",
]
dev = [
    "pytest",
    "mypy",
    "ruff",
]
web = [
    "streamlit",
    "openai",
]
graph = [
    "neo4j",
    "st-link-analysis",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.setuptools]
py-modules = [
    "Utredning",
    "backends",
    "casebook_ui",
    "citations",
    "config",
    "db",
    "download",
    "download_wpu",
    "quality",
    "ocr_pages",
    "ocr_db_helper",
    "build_user_words",
    "errors_log",
    "llm_config_cli",
    "normalize_text",
    "llm_correct",
    "merge_pages",
    "merge_wpu",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag*", "graph*"]
