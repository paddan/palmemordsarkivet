[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palmemordsarkivet"
version = "0.1.0"
description = "Skript för att ladda ner, OCR-tolka och söka i palmemordsarkivet.se"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "requests",
    "gdown",
    "tenacity",
    "langdetect",
    "sentence-transformers<5",
    "lancedb",
    "pyarrow",
    "claude-agent-sdk",
    "pypdfium2",
]

[project.optional-dependencies]
surya = [
    "surya-ocr",
    "transformers<5",
    "pymupdf",
    "pypdfium2",
]
dev = [
    "pytest",
    "mypy",
    "ruff",
]
webui = [
    "streamlit",
    "openai",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.setuptools]
py-modules = [
    "download",
    "quality",
    "ocr_surya",
    "ocr_pages",
    "build_user_words",
    "errors_log",
    "webui",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag*"]
