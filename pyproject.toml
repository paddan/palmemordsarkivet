[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palmemordsarkivet"
version = "0.1.0"
description = "Skript för att ladda ner, OCR-tolka och söka i palmemordsarkivet.se"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "requests>=2.28,<3",
    "gdown>=4.6,<7",
    "tenacity>=8.0,<10",
    "langdetect>=1.0.9,<2",
    "sentence-transformers>=2.2,<5",
    "lancedb>=0.4,<1",
    "pyarrow>=12.0,<25",
    "claude-agent-sdk>=0.1,<1",
    "pypdfium2>=4.28,<5",
]

[project.optional-dependencies]
surya = [
    "surya-ocr>=0.17,<0.18",
    "transformers<5",
    "pymupdf>=1,<2",
    "pypdfium2>=4.28,<5",
]
dev = [
    "pytest",
    "mypy",
    "ruff",
]
web = [
    "streamlit>=1.57,<2",
    "openai>=2,<3",
    "folium>=0.20,<0.21",
    "streamlit-folium>=0.27,<0.28",
]
graph = [
    "neo4j>=6,<7",
    "st-link-analysis>=0.4,<0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.setuptools]
py-modules = [
    "Utredning",
    "backends",
    "casebook_ui",
    "citations",
    "config",
    "download",
    "download_wpu",
    "quality",
    "ocr_pages",
    "ocr_db_helper",
    "build_user_words",
    "errors_log",
    "llm_config_cli",
    "normalize_text",
    "llm_correct",
    "merge_pages",
    "merge_wpu",
    "karta",
    "map_extract",
    "extract_map_observations",
    "admin_ui",
    "compare",
    "facets",
    "llm_usage",
    "prompts",
    "redactions",
    "search_fuzzy",
    "surya_layout",
    "form_layout",
    "surya_worker",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["db*", "rag*", "graph*", "operations*"]
